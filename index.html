<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本田とじゃんけん</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* 動画2枚を完全に重ねる */
.video {
    position: fixed;
    top: 50%;
    left: 50%;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100svh;
    max-height: 100dvh;
    transform: translate(-50%, -50%);
    object-fit: contain;
    background: black;
    opacity: 0;
    pointer-events: none;
}

/* 現在表示中 */
.video.active {
    opacity: 1;
}


/* START */
#start {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 20;

    background: black;
}

#start button {
    width: 300px;
    height: 100px;

    font-size: 40px;
    font-weight: bold;

    border: none;
    border-radius: 10px;

    cursor: pointer;
}


/* じゃんけんボタン */
#buttons {
    position: fixed;

    left: 0;
    bottom: 30px;

    width: 100%;

    display: flex;
    justify-content: center;
    gap: 20px;

    z-index: 10;
}

#buttons button {
    width: 150px;
    height: 70px;

    font-size: 28px;
    font-weight: bold;

    border: none;
    border-radius: 10px;

    cursor: pointer;

    background: white;
    color: black;
}

#buttons button:active {
    transform: scale(0.95);
}


/* 戦績 */
#stats {
    position: fixed;
    inset: 0;

    z-index: 30;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.85);

    color: white;
    text-align: center;
}

#stats h1 {
    font-size: 48px;
    margin-bottom: 35px;
}

.stat {
    font-size: 28px;
    margin: 12px;
}

#stats button {
    margin-top: 35px;

    padding: 15px 40px;

    font-size: 24px;

    border: none;
    border-radius: 10px;

    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* ===== スマホ / 縦長画面対応 ===== */
html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.video {
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100svh;
    max-height: 100dvh;
    object-fit: contain;
}

#start {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#start button {
    width: min(300px, 78vw);
    height: clamp(72px, 18vw, 100px);
    font-size: clamp(28px, 9vw, 40px);
}

#buttons {
    bottom: calc(16px + env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    gap: clamp(8px, 2.5vw, 20px);
    width: 100%;
}

#buttons button {
    flex: 1 1 0;
    width: auto;
    min-width: 0;
    max-width: 150px;
    height: clamp(54px, 12vw, 70px);
    font-size: clamp(20px, 6vw, 28px);
    padding: 0 6px;
}

#stats {
    padding: max(20px, env(safe-area-inset-top))
             max(18px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(18px, env(safe-area-inset-left));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

#stats h1 {
    font-size: clamp(32px, 10vw, 48px);
    margin-top: 0;
    margin-bottom: clamp(20px, 6vw, 35px);
}

.stat {
    font-size: clamp(18px, 5.5vw, 28px);
    margin: clamp(7px, 2.5vw, 12px);
}

#stats button {
    margin-top: clamp(22px, 6vw, 35px);
    padding: clamp(12px, 4vw, 15px) clamp(28px, 9vw, 40px);
    font-size: clamp(20px, 6vw, 24px);
}

@media (orientation: landscape) and (max-height: 600px) {
    #start button {
        width: min(300px, 42vw);
        height: clamp(58px, 22vh, 82px);
        font-size: clamp(26px, 6vh, 38px);
    }

    #buttons {
        bottom: calc(10px + env(safe-area-inset-bottom));
    }

    #buttons button {
        height: clamp(48px, 16vh, 64px);
        font-size: clamp(18px, 5vh, 26px);
    }

    #stats {
        justify-content: flex-start;
        padding-top: max(12px, env(safe-area-inset-top));
    }

    #stats h1 {
        margin-bottom: 12px;
    }

    .stat {
        margin: 5px;
    }

    #stats button {
        margin-top: 14px;
    }
}

</style>
</head>

<body>


<!-- =========================================
     動画プレイヤー2枚
========================================= -->

<video id="videoA"
       class="video active"
       preload="auto"
       playsinline>
</video>

<video id="videoB"
       class="video"
       preload="auto"
       playsinline>
</video>


<!-- START -->
<div id="start">
    <button id="startButton">START</button>
</div>


<!-- じゃんけん -->
<div id="buttons" class="hidden">

    <button>グー</button>

    <button>チョキ</button>

    <button>パー</button>

</div>


<!-- 戦績 -->
<div id="stats" class="hidden">

    <h1>戦績</h1>

    <div class="stat">
        挑戦した日数：
        <span id="days">0</span>日
    </div>

    <div class="stat">
        勝った回数：
        <span id="wins">0</span>回
    </div>

    <div class="stat">
        負けた回数：
        <span id="losses">0</span>回
    </div>

    <div class="stat">
        最大連続あいこ：
        <span id="drawRecord">0</span>回
    </div>

    <button id="statsCloseButton">閉じる</button>

</div>
