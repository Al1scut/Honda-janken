<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本田とじゃんけん</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* 動画2枚を完全に重ねる */
.video {
    position: fixed;
    top: 50%;
    left: 50%;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100svh;
    max-height: 100dvh;
    transform: translate(-50%, -50%);
    object-fit: contain;
    background: black;
    opacity: 0;
    pointer-events: none;
}

/* 現在表示中 */
.video.active {
    opacity: 1;
}


/* START */
#start {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 20;

    background: black;
}

#start button {
    width: 300px;
    height: 100px;

    font-size: 40px;
    font-weight: bold;

    border: none;
    border-radius: 10px;

    cursor: pointer;
}


/* じゃんけんボタン */
#buttons {
    position: fixed;

    left: 0;
    bottom: 30px;

    width: 100%;

    display: flex;
    justify-content: center;
    gap: 20px;

    z-index: 10;
}

#buttons button {
    width: 150px;
    height: 70px;

    font-size: 28px;
    font-weight: bold;

    border: none;
    border-radius: 10px;

    cursor: pointer;

    background: white;
    color: black;
}

#buttons button:active {
    transform: scale(0.95);
}


/* 戦績 */
#stats {
    position: fixed;
    inset: 0;

    z-index: 30;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.85);

    color: white;
    text-align: center;
}

#stats h1 {
    font-size: 48px;
    margin-bottom: 35px;
}

.stat {
    font-size: 28px;
    margin: 12px;
}

#stats button {
    margin-top: 35px;

    padding: 15px 40px;

    font-size: 24px;

    border: none;
    border-radius: 10px;

    cursor: pointer;
}


/* ===== 追加UI ===== */
.update-log {
    margin: 24px auto 0;
    width: min(500px, 88vw);
    text-align: left;
    color: #999;
    font-size: 11px;
    border-top: 1px solid #333;
    padding-top: 10px;
}
.update-title {
    color: #ddd;
    font-weight: bold;
    margin-bottom: 5px;
}
.small-stat { font-size: 17px; opacity: .85; }
.stats-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}
.stats-actions button { margin-top: 0 !important; }
#ranking {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(0,0,0,.92);
    color: #fff;
}
.ranking-card {
    width: min(560px, 94vw);
    max-height: 90vh;
    overflow-y: auto;
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 22px;
}
.ranking-card h2 { margin: 0 0 16px; font-size: 30px; text-align:center; }
.rank-tabs { display:flex; gap:6px; margin-bottom:12px; }
.rank-tab { flex:1; border:1px solid #555; background:#222; color:#ddd; padding:9px; border-radius:5px; cursor:pointer; }
.rank-tab.active { background:#fff; color:#111; }
#rankingList { min-height: 100px; }
.rank-row { display:grid; grid-template-columns:42px 1fr auto; gap:10px; align-items:center; padding:9px 5px; border-bottom:1px solid #292929; }
.rank-row span { color:#aaa; }
.rank-row b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rank-row em { font-style:normal; color:#ccc; }
.rank-loading,.rank-empty { text-align:center; color:#888; padding:30px 0; }
.ranking-register { margin-top:16px; border-top:1px solid #333; padding-top:15px; }
.ranking-register input { width:calc(100% - 90px); padding:10px; border:1px solid #555; border-radius:5px; background:#222; color:#fff; font-size:16px; }
.ranking-register button { width:76px; padding:10px 4px; margin-left:6px; border:0; border-radius:5px; cursor:pointer; }
#rankingMessage { color:#aaa; font-size:12px; min-height:18px; margin-top:6px; }
.ranking-close { width:100%; margin-top:15px; padding:11px; border:0; border-radius:5px; cursor:pointer; }
@media (max-width:600px) {
    .stats-actions button { width:100%; max-width:260px; }
}

.hidden {
    display: none !important;
}

/* ===== スマホ / 縦長画面対応 ===== */
html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.video {
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100svh;
    max-height: 100dvh;
    object-fit: contain;
}

#start {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#start button {
    width: min(300px, 78vw);
    height: clamp(72px, 18vw, 100px);
    font-size: clamp(28px, 9vw, 40px);
}

#buttons {
    bottom: calc(16px + env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    gap: clamp(8px, 2.5vw, 20px);
    width: 100%;
}

#buttons button {
    flex: 1 1 0;
    width: auto;
    min-width: 0;
    max-width: 150px;
    height: clamp(54px, 12vw, 70px);
    font-size: clamp(20px, 6vw, 28px);
    padding: 0 6px;
}

#stats {
    padding: max(20px, env(safe-area-inset-top))
             max(18px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(18px, env(safe-area-inset-left));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

#stats h1 {
    font-size: clamp(32px, 10vw, 48px);
    margin-top: 0;
    margin-bottom: clamp(20px, 6vw, 35px);
}

.stat {
    font-size: clamp(18px, 5.5vw, 28px);
    margin: clamp(7px, 2.5vw, 12px);
}

#stats button {
    margin-top: clamp(22px, 6vw, 35px);
    padding: clamp(12px, 4vw, 15px) clamp(28px, 9vw, 40px);
    font-size: clamp(20px, 6vw, 24px);
}

@media (orientation: landscape) and (max-height: 600px) {
    #start button {
        width: min(300px, 42vw);
        height: clamp(58px, 22vh, 82px);
        font-size: clamp(26px, 6vh, 38px);
    }

    #buttons {
        bottom: calc(10px + env(safe-area-inset-bottom));
    }

    #buttons button {
        height: clamp(48px, 16vh, 64px);
        font-size: clamp(18px, 5vh, 26px);
    }

    #stats {
        justify-content: flex-start;
        padding-top: max(12px, env(safe-area-inset-top));
    }

    #stats h1 {
        margin-bottom: 12px;
    }

    .stat {
        margin: 5px;
    }

    #stats button {
        margin-top: 14px;
    }
}

</style>
</head>

<!-- START -->
<div id="start">
    <div>
        <button id="startButton">START</button>
        <div class="update-log">
            <div class="update-title">更新ログ</div>
            <div class="update-entry">2026/09/20　【削除】さんま・ごぼうモード</div>
            <div class="update-entry">2026/09/20　【実装】共有ランキング（1か月・1週間・3日）</div>

</div>


<!-- 戦績 -->
<div id="stats" class="hidden">

    <h1>戦績</h1>

    <div class="stat">
        挑戦した日数：
        <span id="days">0</span>日
    </div>

    <div class="stat">
        勝った回数：
        <span id="wins">0</span>回
    </div>

    <div class="stat">
        負けた回数：
        <span id="losses">0</span>回
    </div>

    <div class="stat">
        最大連続あいこ：
        <span id="drawRecord">0</span>回
    </div>
    <div class="stat small-stat">
        スコア：<span id="score">0</span> pt
    </div>

    <div class="stats-actions">
        <button id="openRankingButton">ランキングを見る</button>
        <button id="registerRankingButton">ランキングに登録</button>
        <button id="statsCloseButton">閉じる</button>
    </div>

</div>

<!-- ランキング -->
<div id="ranking" class="hidden">
    <div class="ranking-card">
        <h2>ランキング</h2>
        <div class="rank-tabs">
            <button class="rank-tab active" data-period="month">1か月</button>
            <button class="rank-tab" data-period="week">1週間</button>
            <button class="rank-tab" data-period="3day">3日</button>
        </div>
        <div id="rankingList"></div>
        <div class="ranking-register">
            <input id="rankingName" type="text" maxlength="24" placeholder="名前（24文字まで）">
            <button id="submitRankingButton">登録</button>
            <div id="rankingMessage"></div>
        </div>
        <button id="rankingCloseButton" class="ranking-close">戻る</button>
    </div>
</div>
